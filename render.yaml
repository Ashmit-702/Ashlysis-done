services:
  - type: web
    name: ashlysis
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --max-requests 10 --max-requests-jitter 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
